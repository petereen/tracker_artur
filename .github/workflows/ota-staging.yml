name: OTA Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ota-staging
  cancel-in-progress: false

jobs:
  upload-and-activate:
    runs-on: ubuntu-latest
    environment: staging

    defaults:
      run:
        working-directory: frontend

    env:
      OTA_BUNDLE_VERSION: 1.0.${{ github.run_number }}.${{ github.run_attempt }}
      OTA_UPLOAD_TOKEN: ${{ secrets.OTA_UPLOAD_TOKEN }}
      OTA_API_URL: ${{ vars.OTA_API_URL || 'https://erp.oyuns.mn/api/v1/mobile-updates' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test, build, and upload staging bundle
        run: npm run ota:upload:staging

      - name: Activate staging bundle
        run: ./scripts/ota-promote-self-hosted.sh
        env:
          OTA_CHANNEL: staging
