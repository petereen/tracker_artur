services:
  backend-replica:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://erp.oyuns.mn}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://erp.oyuns.mn}
      ATTACHMENT_STORAGE_BACKEND: local
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: clamav
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_WEBHOOK_URL: ${GOOGLE_WEBHOOK_URL:-}
    volumes:
      - knowledge_uploads:/app/uploads/knowledge
      - attachment_uploads:/app/uploads/attachments
      - avatar_uploads:/app/uploads/avatars
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

