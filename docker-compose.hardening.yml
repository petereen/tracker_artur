services:
  jev-router:
    build:
      context: .
      dockerfile: jev-router/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8030
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://api.typesafe.ai}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-1.13.0}
      TYPESAFE_TIMEOUT_MS: ${TYPESAFE_TIMEOUT_MS:-2500}
      TYPESAFE_MAX_ATTEMPTS: ${TYPESAFE_MAX_ATTEMPTS:-2}
      JEV_ROUTER_SHARED_SECRET: ${JEV_ROUTER_SHARED_SECRET:-}
    expose:
      - "8030"
  backend-replica:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      JEV_ROUTER_ENABLED: ${JEV_ROUTER_ENABLED:-true}
      JEV_ROUTER_URL: ${JEV_ROUTER_URL:-http://jev-router:8030}
      JEV_ROUTER_SHARED_SECRET: ${JEV_ROUTER_SHARED_SECRET:-}
      JEV_ROUTER_TIMEOUT_SECONDS: ${JEV_ROUTER_TIMEOUT_SECONDS:-2.8}
      JEV_ROUTER_CONFIDENCE_THRESHOLD: ${JEV_ROUTER_CONFIDENCE_THRESHOLD:-0.90}
      JEV_ROUTER_MODEL: ${TYPESAFE_MODEL:-jev-1.13.0}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://erp.oyuns.mn}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://erp.oyuns.mn}
      NATIVE_APP_ORIGINS: ${NATIVE_APP_ORIGINS:-capacitor://localhost,https://localhost}
      OTA_ENABLED: ${OTA_ENABLED:-false}
      OTA_APP_ID: ${OTA_APP_ID:-mn.oyuns.workspace}
      OTA_PUBLIC_BASE_URL: ${OTA_PUBLIC_BASE_URL:-https://erp.oyuns.mn/api/v1/mobile-updates}
      OTA_BUNDLE_DIR: ${OTA_BUNDLE_DIR:-/app/uploads/ota}
      OTA_MAX_BUNDLE_BYTES: ${OTA_MAX_BUNDLE_BYTES:-104857600}
      OTA_UPLOAD_TOKEN: ${OTA_UPLOAD_TOKEN:-}
      TELEGRAM_OIDC_CLIENT_ID: ${TELEGRAM_OIDC_CLIENT_ID:-}
      TELEGRAM_OIDC_CLIENT_SECRET: ${TELEGRAM_OIDC_CLIENT_SECRET:-}
      TELEGRAM_OIDC_REDIRECT_URI: ${TELEGRAM_OIDC_REDIRECT_URI:-https://erp.oyuns.mn/api/v1/auth/telegram/callback}
      TELEGRAM_OIDC_NATIVE_REDIRECT_URI: ${TELEGRAM_OIDC_NATIVE_REDIRECT_URI:-https://erp.oyuns.mn/mobile-auth/telegram/callback}
      TELEGRAM_OIDC_ISSUER: ${TELEGRAM_OIDC_ISSUER:-https://oauth.telegram.org}
      ATTACHMENT_STORAGE_BACKEND: local
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: clamav
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_WEBHOOK_URL: ${GOOGLE_WEBHOOK_URL:-}
    volumes:
      - knowledge_uploads:/app/uploads/knowledge
      - attachment_uploads:/app/uploads/attachments
      - avatar_uploads:/app/uploads/avatars
      - ota_bundles:/app/uploads/ota
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
