server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    add_header Permissions-Policy "camera=(self), microphone=(self), fullscreen=(self), picture-in-picture=(self)" always;
    add_header Referrer-Policy "same-origin" always;
    # The company library accepts individual files up to 25 MB. Nginx defaults
    # to 1 MB, rejecting otherwise valid uploads before they reach the API.
    client_max_body_size 100m;

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    # Compatibility for deployments that still have Telegram's native callback
    # URI configured as TELEGRAM_OIDC_REDIRECT_URI. Native apps intercept this
    # URL before it reaches nginx; a browser transaction is protected by the
    # state cookie and is handled by the same backend OIDC callback.
    location = /mobile-auth/telegram/callback {
        proxy_pass http://backend:8000/v1/auth/telegram/callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

#    location /api/ {
        # Backend is a separate (internal-ingress) Container App in the same
        # environment. Resolved at startup via the container's internal DNS,
        # which knows the *.internal.<env> names. Trailing slash strips /api/.
        # proxy_pass https://ca-tracker-artur-api.internal.wittyhill-ad6320ed.northeurope.azurecontainerapps.io:443/;
        # proxy_set_header Host ca-tracker-artur-api.internal.wittyhill-ad6320ed.northeurope.azurecontainerapps.io;
        # proxy_ssl_server_name on;
        # proxy_ssl_name ca-tracker-artur-api.internal.wittyhill-ad6320ed.northeurope.azurecontainerapps.io;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
    # }
    location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    }
    location /socket.io/ {
    proxy_pass http://call-signaling:8020/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
