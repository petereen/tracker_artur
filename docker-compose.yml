services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.4
    # clamav/clamav:1.4 currently publishes amd64 only; Docker Desktop
    # emulates this platform on Apple Silicon hosts.
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav

  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d sales_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      BOT_TOKEN: ${BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      MANAGER_TG_ID: ${MANAGER_TG_ID:-306983322}
      MINI_APP_URL: ${MINI_APP_URL:-https://erp.oyuns.mn/tg}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_REDIS_URL: ${AI_REDIS_URL:-redis://redis:6379/0}
      AI_MODEL_REGISTRY_JSON: ${AI_MODEL_REGISTRY_JSON:-}
      ENTERPRISE_TOOLS_ENABLED: ${ENTERPRISE_TOOLS_ENABLED:-false}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      AGENT_RATES_API_KEY: ${AGENT_RATES_API_KEY:-}
      OPENAI_WHISPER_MODEL: ${OPENAI_WHISPER_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_MONGOLIAN_TRANSCRIBE_MODEL: ${OPENAI_MONGOLIAN_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_TASK_MODEL: ${OPENAI_TASK_MODEL:-gpt-4o-mini}
      OPENAI_ASSISTANT_MODEL: ${OPENAI_ASSISTANT_MODEL:-gpt-5.6-luna}
      OPENAI_TRANSCRIBE_LANGUAGE: ${OPENAI_TRANSCRIBE_LANGUAGE:-}
      CHIMEGE_API_TOKEN: ${CHIMEGE_API_TOKEN:-}
      CHIMEGE_TTS_API_TOKEN: ${CHIMEGE_TTS_API_TOKEN:-}
      CHIMEGE_PUNCTUATE: ${CHIMEGE_PUNCTUATE:-true}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://erp.oyuns.mn}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://erp.oyuns.mn}
      AUTH_EMAIL_VERIFICATION_ENABLED: ${AUTH_EMAIL_VERIFICATION_ENABLED:-false}
      TELEGRAM_REFRESH_TOKEN_DAYS: ${TELEGRAM_REFRESH_TOKEN_DAYS:-365}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ATTACHMENT_STORAGE_BACKEND: ${ATTACHMENT_STORAGE_BACKEND:-local}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-10}
      AVATAR_MAX_BYTES: ${AVATAR_MAX_BYTES:-2097152}
      AVATAR_MAX_PIXELS: ${AVATAR_MAX_PIXELS:-256}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_WEBHOOK_URL: ${GOOGLE_WEBHOOK_URL:-}
    ports:
      # Keep the API private; the frontend proxies /api/ to it on the Docker network.
      - "127.0.0.1:8010:8000"
    volumes:
      - knowledge_uploads:/app/uploads/knowledge
      - attachment_uploads:/app/uploads/attachments
      - avatar_uploads:/app/uploads/avatars
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build: ./backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      BOT_TOKEN: ${BOT_TOKEN:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://erp.oyuns.mn}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_WEBHOOK_URL: ${GOOGLE_WEBHOOK_URL:-}
      MANAGER_TG_ID: ${MANAGER_TG_ID:-306983322}
      MINI_APP_URL: ${MINI_APP_URL:-https://erp.oyuns.mn/tg}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_REDIS_URL: ${AI_REDIS_URL:-redis://redis:6379/0}
      AI_MODEL_REGISTRY_JSON: ${AI_MODEL_REGISTRY_JSON:-}
      ENTERPRISE_TOOLS_ENABLED: ${ENTERPRISE_TOOLS_ENABLED:-false}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      AGENT_RATES_API_KEY: ${AGENT_RATES_API_KEY:-}
      OPENAI_WHISPER_MODEL: ${OPENAI_WHISPER_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_MONGOLIAN_TRANSCRIBE_MODEL: ${OPENAI_MONGOLIAN_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_TASK_MODEL: ${OPENAI_TASK_MODEL:-gpt-4o-mini}
      OPENAI_ASSISTANT_MODEL: ${OPENAI_ASSISTANT_MODEL:-gpt-5.6-luna}
      OPENAI_TRANSCRIBE_LANGUAGE: ${OPENAI_TRANSCRIBE_LANGUAGE:-}
      CHIMEGE_API_TOKEN: ${CHIMEGE_API_TOKEN:-}
      CHIMEGE_TTS_API_TOKEN: ${CHIMEGE_TTS_API_TOKEN:-}
      CHIMEGE_PUNCTUATE: ${CHIMEGE_PUNCTUATE:-true}
    command: python -m app.bot.main

  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      BOT_TOKEN: ${BOT_TOKEN:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://erp.oyuns.mn}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_WEBHOOK_URL: ${GOOGLE_WEBHOOK_URL:-}
    # The API may be allowed to start in Dokploy recovery mode; the worker
    # must still refuse to run against a schema missing enterprise tables.
    command: sh -c "alembic upgrade head && exec python -m app.worker"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Dokploy should expose erp.oyuns.mn; artur.oyuns.mn remains the legacy admin host.
      - "127.0.0.1:3010:80"
    networks:
      default: {}
      # Lets the shared Nginx edge proxy reach this container.
      web-edge:
        aliases:
          - oyuns-agent-frontend

volumes:
  redis_data:
  pgdata:
  knowledge_uploads:
  attachment_uploads:
  avatar_uploads:
  clamav_data:

networks:
  web-edge:
    external: true
