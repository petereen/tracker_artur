# Dokploy deployment: configure the public domain in Dokploy's Domains tab
# and select the `frontend` service on port 80.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav

  db:
    # The enterprise knowledge migration creates the pgvector extension.
    # Plain postgres:15 does not ship vector.control and leaves the schema
    # migration half-applied.
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d sales_tracker"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    environment: &app_environment
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      BOT_TOKEN: ${BOT_TOKEN:-}
      TELEGRAM_OIDC_CLIENT_ID: ${TELEGRAM_OIDC_CLIENT_ID:-}
      TELEGRAM_OIDC_CLIENT_SECRET: ${TELEGRAM_OIDC_CLIENT_SECRET:-}
      TELEGRAM_OIDC_REDIRECT_URI: ${TELEGRAM_OIDC_REDIRECT_URI:-https://erp.oyuns.mn/api/v1/auth/telegram/callback}
      TELEGRAM_OIDC_NATIVE_REDIRECT_URI: ${TELEGRAM_OIDC_NATIVE_REDIRECT_URI:-https://erp.oyuns.mn/mobile-auth/telegram/callback}
      TELEGRAM_OIDC_ISSUER: ${TELEGRAM_OIDC_ISSUER:-https://oauth.telegram.org}
      MANAGER_TG_ID: ${MANAGER_TG_ID}
      MINI_APP_URL: ${MINI_APP_URL:-https://erp.oyuns.mn/tg}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_REDIS_URL: ${AI_REDIS_URL:-redis://redis:6379/0}
      WORKTIME_QR_SIGNING_SECRET: ${WORKTIME_QR_SIGNING_SECRET:-}
      WORKTIME_QR_REDIS_URL: ${WORKTIME_QR_REDIS_URL:-redis://redis:6379/0}
      AI_MODEL_REGISTRY_JSON: ${AI_MODEL_REGISTRY_JSON:-}
      AI_MCP_ENABLED: ${AI_MCP_ENABLED:-false}
      AI_MCP_SERVER_URL: ${AI_MCP_SERVER_URL:-}
      AI_MCP_ORGANIZATION_ALLOWLIST: ${AI_MCP_ORGANIZATION_ALLOWLIST:-}
      MCP_CATALOG_VERSION: ${MCP_CATALOG_VERSION:-2026-08-01.1}
      MCP_TOKEN_ISSUER: ${MCP_TOKEN_ISSUER:-oyuns}
      MCP_TOKEN_TTL_SECONDS: ${MCP_TOKEN_TTL_SECONDS:-120}
      MCP_INTERNAL_SHARED_SECRET: ${MCP_INTERNAL_SHARED_SECRET:-}
      AGENT_RATES_API_KEY: ${AGENT_RATES_API_KEY:-}
      OPENAI_WHISPER_MODEL: ${OPENAI_WHISPER_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_MONGOLIAN_TRANSCRIBE_MODEL: ${OPENAI_MONGOLIAN_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_TASK_MODEL: ${OPENAI_TASK_MODEL:-gpt-4o-mini}
      OPENAI_ASSISTANT_MODEL: ${OPENAI_ASSISTANT_MODEL:-gpt-5.6-luna}
      OPENAI_TRANSCRIBE_LANGUAGE: ${OPENAI_TRANSCRIBE_LANGUAGE:-}
      CHIMEGE_API_TOKEN: ${CHIMEGE_API_TOKEN:-}
      CHIMEGE_TTS_API_TOKEN: ${CHIMEGE_TTS_API_TOKEN:-}
      CHIMEGE_PUNCTUATE: ${CHIMEGE_PUNCTUATE:-true}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://erp.oyuns.mn}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://erp.oyuns.mn}
      NATIVE_APP_ORIGINS: ${NATIVE_APP_ORIGINS:-capacitor://localhost,https://localhost}
      OTA_ENABLED: ${OTA_ENABLED:-false}
      OTA_APP_ID: ${OTA_APP_ID:-mn.oyuns.workspace}
      OTA_PUBLIC_BASE_URL: ${OTA_PUBLIC_BASE_URL:-https://erp.oyuns.mn/api/v1/mobile-updates}
      OTA_BUNDLE_DIR: ${OTA_BUNDLE_DIR:-/app/uploads/ota}
      OTA_MAX_BUNDLE_BYTES: ${OTA_MAX_BUNDLE_BYTES:-104857600}
      OTA_UPLOAD_TOKEN: ${OTA_UPLOAD_TOKEN:-}
      AUTH_EMAIL_VERIFICATION_ENABLED: ${AUTH_EMAIL_VERIFICATION_ENABLED:-false}
      TELEGRAM_REFRESH_TOKEN_DAYS: ${TELEGRAM_REFRESH_TOKEN_DAYS:-365}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ATTACHMENT_STORAGE_BACKEND: ${ATTACHMENT_STORAGE_BACKEND:-local}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-10}
      MOBILE_PUSH_DELIVERY_ENABLED: ${MOBILE_PUSH_DELIVERY_ENABLED:-false}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-mn.oyuns.workspace}
      APNS_USE_SANDBOX: ${APNS_USE_SANDBOX:-false}
      AVATAR_MAX_BYTES: ${AVATAR_MAX_BYTES:-2097152}
      AVATAR_MAX_PIXELS: ${AVATAR_MAX_PIXELS:-256}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_WEBHOOK_URL: ${GOOGLE_WEBHOOK_URL:-}
      # Keep the backend reachable when migrations need to be run manually
      # from Dokploy's terminal during a recovery deployment.
      ALLOW_START_WITH_MIGRATION_FAILURE: ${ALLOW_START_WITH_MIGRATION_FAILURE:-true}
    expose:
      - "8000"
    volumes:
      - knowledge_uploads:/app/uploads/knowledge
      - attachment_uploads:/app/uploads/attachments
      - avatar_uploads:/app/uploads/avatars
      - ota_bundles:/app/uploads/ota
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment: *app_environment
    command: python -m app.bot.main

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment: *app_environment
    # Run migrations from the worker startup path too. This prevents the
    # index scan from querying knowledge_documents before its migration exists.
    command: sh -c "alembic upgrade head && exec python -m app.worker"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_OTA_CHANNEL: ${VITE_OTA_CHANNEL:-production}
    restart: unless-stopped
    environment:
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      ANDROID_SIGNING_CERT_SHA256: ${ANDROID_SIGNING_CERT_SHA256:-}
    depends_on:
      - backend
    expose:
      - "80"

volumes:
  redis_data:
  pgdata:
  knowledge_uploads:
  attachment_uploads:
  avatar_uploads:
  ota_bundles:
  clamav_data:
